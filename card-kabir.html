<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Kabir Mehta — AI Card · Celebso X</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cx-bg': '#f5f2eb',
            'cx-card': '#ffffff',
            'cx-dark': '#111315',
            'cx-blue': '#4a6cf7',
            'cx-border': '#e5e0d8',
          },
          fontFamily: {
            'display': ['Playfair Display', 'serif'],
            'body': ['Plus Jakarta Sans', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    html, body { margin: 0; padding: 0; background-color: #f5f2eb; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-body text-cx-dark antialiased min-h-screen bg-cx-bg flex flex-col">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-[#fcf9f2]/90 backdrop-blur-md border-b border-cx-border">
    <div class="max-w-5xl mx-auto h-16 px-4 flex items-center justify-between">
      <a href="portfolio.html" class="flex items-center gap-2 text-sm font-mono uppercase tracking-wider text-cx-dark hover:text-cx-blue transition-colors">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        <span>Back to Portfolio</span>
      </a>
      <a href="index.html" class="flex items-center">
        <img src="assets/celebsox_brand_header.png" alt="CelebsoX" class="h-7 w-auto object-contain"/>
      </a>
      <div class="flex items-center gap-3">
        <a href="portfolio.html#discovery-section" class="hidden sm:inline-flex items-center bg-black text-white text-xs font-mono uppercase px-3 py-1.5 hover:bg-cx-blue transition-colors tracking-wider">
          [ Explore All ]
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CARD CONTAINER -->
  <main class="flex-1 pt-24 pb-12 px-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-[480px] flex flex-col items-center">
      
      <!-- CARD WRAPPER WITH SUBTLE SHADOW & FRAME -->
      <div class="w-full bg-white rounded-2xl shadow-2xl border border-cx-border/80 overflow-hidden transition-transform duration-300 hover:shadow-3xl">
        <img src="assets/card_kabir_score.jpg" alt="Kabir Mehta — AI Card" class="w-full h-auto object-cover block" />
      </div>

      <!-- ACTION BUTTONS -->
      <div class="w-full mt-6 grid grid-cols-2 gap-3">
        <button type="button" class="flex items-center justify-center gap-2 bg-black text-white py-3 px-4 rounded-xl font-mono text-xs uppercase tracking-wider hover:bg-cx-blue active:scale-95 transition-all text-center font-medium shadow-md cursor-pointer select-none">
          <span class="material-symbols-outlined text-[16px]">visibility</span>
          <span>View Profile</span>
        </button>
        <button onclick="navigator.clipboard.writeText(window.location.href); alert('Card Link Copied!');" class="flex items-center justify-center gap-2 bg-white border border-cx-border text-cx-dark py-3 px-4 rounded-xl font-mono text-xs uppercase tracking-wider hover:bg-gray-100 transition-colors text-center font-medium shadow-sm">
          <span class="material-symbols-outlined text-[16px]">share</span>
          <span>Share Pass</span>
        </button>
      </div>

      <div class="mt-4 text-center">
        <p class="font-mono text-[11px] text-gray-500 uppercase tracking-widest">
          Cryptographically Verified · Celebso Autonomous ID
        </p>
      </div>

    </div>
  </main>

</body>
</html>
