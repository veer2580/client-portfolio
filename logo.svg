<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <clipPath id="frameClip">
      <rect x="2" y="2" width="28" height="28" />
    </clipPath>
  </defs>
  <!-- Clipped Architectural Diagonals -->
  <g clip-path="url(#frameClip)">
    <!-- Black Diagonal: Bottom-Left to Top-Right -->
    <line x1="2" y1="30" x2="30" y2="2" stroke="#1b1c19" stroke-width="2.5" />
    <!-- Electric Blue Diagonal: Top-Left to Bottom-Right -->
    <line x1="2" y1="2" x2="30" y2="30" stroke="#004edc" stroke-width="2.5" />
  </g>
  <!-- Architectural Square Outer Frame -->
  <rect x="2" y="2" width="28" height="28" stroke="#1b1c19" stroke-width="2.5" fill="none" />
  <!-- Center Structural Golden Node -->
  <circle cx="16" cy="16" r="3.2" fill="#c89a3c" stroke="#faf9f4" stroke-width="1.2" />
</svg>